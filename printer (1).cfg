[mcu]
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
baud: 250000
restart_method: arduino

[printer]
kinematics: cartesian
max_velocity: 600
max_accel: 10000
max_z_velocity: 100
max_z_accel: 1000
square_corner_velocity: 5.0

[stepper_x]
step_pin: !PC7
dir_pin: PA6
enable_pin: PC5
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
step_pulse_duration: 0.000003
endstop_pin: ^PE4
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 40
second_homing_speed: 5
homing_retract_dist: 3
homing_positive_dir: false

[stepper_y]
step_pin: !PA2
dir_pin: PA0
enable_pin: PA4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
step_pulse_duration: 0.000003
endstop_pin: ^PH6
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 40
second_homing_speed: 5
homing_retract_dist: 3
homing_positive_dir: false

[stepper_z]
step_pin: !PC1
dir_pin: PC3
enable_pin: PD7
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
step_pulse_duration: 0.000003
endstop_pin: ^PE5
position_endstop: 0
position_min: 0
position_max: 50
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 2
homing_positive_dir: false

[gcode_button x_max_limit]
pin: ^PE3                   # Mega D5  X MAX (Pink)
press_gcode:
  M112

[gcode_button y_max_limit]
pin: ^PH4                   # Mega D7  Y MAX (Green)
press_gcode:
  M112

[idle_timeout]
timeout: 31536000
gcode:
  M117 Idle

[respond]

[gcode_macro PNP_HOME]
gcode:
  G28
  M114
